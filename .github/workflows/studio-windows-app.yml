name: Studio in the Windows app

# The Studio inside the real Windows app, with OBS's engine beside it as the installer puts it
# (deploy/obs-runtime-windows.ps1): the picture in the window, a real click on it reaching the
# page, and an MKV recording (deploy/studio-windows-check.ps1). Also builds a test installer to
# try on a Windows PC. Runs on the windows-studio branch (with ferrocast-web's branch of the
# same name) and by hand.

on:
  push:
    branches: [windows-studio]
  workflow_dispatch:

concurrency:
  group: studio-windows-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: Studio in the app (Windows)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/ferrocast-web
          ref: ${{ github.ref_name == 'windows-studio' && 'windows-studio' || 'main' }}
          token: ${{ github.token }}
          path: ferrocast-web
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ferrocast-web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ferrocast-web/pnpm-lock.yaml
      - name: Build the dashboard and overlays
        working-directory: ferrocast-web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: OBS's engine
        shell: pwsh
        run: deploy/obs-runtime-windows.ps1
      - name: Debug build, with the engine beside it
        shell: pwsh
        env:
          FERROCAST_WEB_DIST: ${{ github.workspace }}/ferrocast-web/dist
        run: |
          cargo build --locked -p ferrocast-desktop --bins --features deepfilter
          Copy-Item -Recurse -Force apps/desktop/obs-runtime/obs target/debug/
          Copy-Item -Force apps/desktop/obs-runtime/root/* target/debug/
      - name: Ferrocast's filters on D3D11
        shell: pwsh
        run: |
          $env:FERROCAST_OBS_DIR = (Resolve-Path apps/desktop/obs-runtime/obs).Path
          cargo run --locked -p ferrocast-studio --example filters -- "$env:RUNNER_TEMP/filters"
      - name: Strong noise removal (DeepFilterNet)
        shell: pwsh
        run: cargo test --locked -p ferrocast-studio --features deepfilter --lib denoise
      - name: Remove background on D3D11 (RVM, the installer's model)
        shell: pwsh
        run: |
          $env:FERROCAST_OBS_DIR = (Resolve-Path apps/desktop/obs-runtime/obs).Path
          cargo run --locked -p ferrocast-studio --example cutout -- none "$env:RUNNER_TEMP/cutout"
      - name: The Studio in the app
        shell: pwsh
        run: deploy/studio-windows-check.ps1 -Exe target/debug/ferrocast.exe -Out "$env:RUNNER_TEMP/check"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: studio-windows-app-check
          path: |
            ${{ runner.temp }}/check/*.png
            ${{ runner.temp }}/check/*.log
          if-no-files-found: ignore
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Test installer
        working-directory: apps/desktop
        shell: pwsh
        env:
          FERROCAST_WEB_DIST: ${{ github.workspace }}/ferrocast-web/dist
          # As the release build, so sign-ins work in the test app too.
          FERROCAST_TWITCH_CLIENT_ID: ${{ vars.FERROCAST_TWITCH_CLIENT_ID }}
          FERROCAST_YOUTUBE_CLIENT_ID: ${{ vars.FERROCAST_YOUTUBE_CLIENT_ID }}
          FERROCAST_YOUTUBE_CLIENT_SECRET: ${{ secrets.FERROCAST_YOUTUBE_CLIENT_SECRET }}
          FERROCAST_RELAY_URL: https://ferrocast-relay.clearcraftlabs.com
        run: cargo tauri build --bundles nsis --features deepfilter --config obs-runtime/tauri.obs.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferrocast-windows-test-installer
          path: target/release/bundle/nsis/*.exe
