name: Windows smoke

# Runs the built app on GitHub's Windows runner and drives the Studio (tools/windows-smoke.ps1):
# a display, an Edge window with its sound, desktop sound, a 20 s recording; then checks the
# app lived and the file has picture and sound. Screenshots, the log, the numbers and any
# crash dump are kept as the run's artifact. The Windows engine broke unseen while it was only
# compiled on CI (Nov 2026): this runs it.

on:
  push:
    branches: [main, own-engine-only]
    paths:
      - 'crates/**'
      - 'apps/desktop/**'
      - 'Cargo.lock'
      - 'tools/windows-smoke.ps1'
      - '.github/workflows/windows-smoke.yml'
  workflow_dispatch:
    inputs:
      web_ref:
        description: ferrocast-web branch to build the dashboard from (default the same branch name)
        required: false
        default: ''

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: Run the app on Windows
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/ferrocast-web
          ref: ${{ inputs.web_ref || github.ref_name }}
          token: ${{ github.token }}
          path: ferrocast-web
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ferrocast-web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ferrocast-web/pnpm-lock.yaml
      - name: Build the dashboard
        working-directory: ferrocast-web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the app (release, with the debug token file)
        shell: bash
        env:
          FERROCAST_WEB_DIST: ${{ github.workspace }}/ferrocast-web/dist
        run: >
          cargo build --release --locked -p ferrocast-desktop
          --config 'profile.release.package.ferrocast-desktop.debug-assertions=true'
      - name: Smoke test
        shell: pwsh
        run: ./tools/windows-smoke.ps1 -Exe target/release/ferrocast.exe -Out smoke/run -Seconds 20 -Fps 30
      - name: Crash report test (the app faults on purpose; its minidump must be written)
        if: always()
        shell: pwsh
        run: ./tools/windows-smoke.ps1 -Exe target/release/ferrocast.exe -Out smoke/crash -Crash
      - name: Keep what it saw
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke
          path: smoke/
          if-no-files-found: warn
          retention-days: 14
