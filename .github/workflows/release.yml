name: Release

# Builds the desktop app for macOS (universal), Windows (per-user NSIS) and Linux (deb, rpm,
# AppImage) and attaches them to a draft GitHub release (R-62). Nothing is published until
# the owner reviews the draft. Actions are pinned to commit SHAs.
#
# Tags: v0.1.0 is a stable release; v0.1.0-beta.1 (any version with a "-") is a beta: a
# draft *prerelease* that never becomes "latest", so stable users' feed
# (releases/latest/download/latest.json) never offers it. Publishing either one runs
# "Beta feed" (beta-feed.yml), which puts it in the beta channel's own feed. The tag must
# match [workspace.package] version in Cargo.toml, or nothing is built.
#
# Needs, in this repo's settings:
#   secrets FERROCAST_YOUTUBE_CLIENT_SECRET, TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) for updates;
#   variables FERROCAST_TWITCH_CLIENT_ID and FERROCAST_YOUTUBE_CLIENT_ID.
#   secrets MACOS_SIGNING_P12 (base64) and MACOS_SIGNING_P12_PASSWORD: Ferrocast's own
#   long-lived signing certificate (R-80). Without them macOS builds are ad-hoc signed again.
# macOS builds are signed with that self-made certificate (no paid Apple account), so macOS
# keeps Camera, Microphone and Screen Recording answers across updates; people still install
# with Homebrew (packaging/homebrew) or open the DMG and press "Open Anyway" once. Windows
# builds are unsigned until SignPath (R-61).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the job that drafts the release may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version check
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches Cargo.toml
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            packaging/check-version.sh "$TAG" | tee -a "$GITHUB_OUTPUT"
          else
            # A manual run without a tag builds whatever Cargo.toml says, as a test.
            v="$(awk '/^\[workspace.package\]/{s=1;next} /^\[/{s=0} s&&$1=="version"{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)"
            packaging/check-version.sh "v$v" | tee -a "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin
            out: target/universal-apple-darwin/release/bundle
          - name: Windows
            os: windows-2025
            targets: ""
            args: ""
            out: target/release/bundle
          - name: Linux
            os: ubuntu-24.04
            targets: ""
            args: ""
            out: target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/ferrocast-web
          # ferrocast-web is public, so the built-in token can read it.
          token: ${{ github.token }}
          path: ferrocast-web
          # Build scripts run later; they must not find the token in .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ferrocast-web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ferrocast-web/pnpm-lock.yaml
      - name: Build the dashboard and overlays
        working-directory: ferrocast-web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Linux libraries for the desktop shell (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev rpm
      - name: Rust targets
        if: matrix.targets != ''
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          read -ra targets <<< "$TARGETS"
          rustup target add "${targets[@]}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Signing identity (macOS)
        if: matrix.name == 'macOS'
        shell: bash
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [[ -z "$MACOS_SIGNING_P12" ]]; then
            echo "::warning::No MACOS_SIGNING_P12: ad-hoc signed, so macOS forgets permissions on this update."
            exit 0
          fi
          id=$(deploy/macos-signing.sh setup)
          echo "APPLE_SIGNING_IDENTITY=$id" >> "$GITHUB_ENV"
      # A universal build merges only the app's own binary; the bundler then looks for every
      # other [[bin]] (the recording muxer) already merged in target/universal-apple-darwin.
      - name: Universal helper binaries (macOS)
        if: matrix.name == 'macOS'
        shell: bash
        env:
          FERROCAST_WEB_DIST: ${{ github.workspace }}/ferrocast-web/dist
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p ferrocast-desktop --bin obs-ffmpeg-mux --target "$t"
          done
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/obs-ffmpeg-mux \
            target/aarch64-apple-darwin/release/obs-ffmpeg-mux target/x86_64-apple-darwin/release/obs-ffmpeg-mux
          # Signed as the app is: signing the app checks every binary inside it is signed.
          codesign --force --options runtime --sign "${APPLE_SIGNING_IDENTITY:--}" \
            target/universal-apple-darwin/release/obs-ffmpeg-mux
      # The Studio runs OBS's engine; the app carries it, so users don't install OBS.
      - name: OBS's engine inside the app (macOS)
        if: matrix.name == 'macOS'
        shell: bash
        run: deploy/obs-runtime-macos.sh
      - name: OBS's engine in the installer (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: deploy/obs-runtime-windows.ps1
      - name: Build the app
        shell: bash
        env:
          FERROCAST_WEB_DIST: ${{ github.workspace }}/ferrocast-web/dist
          # Public app ids live in repo variables; Google's installed-app secret is a
          # repo secret (it ships inside the app, but stays out of the repo).
          FERROCAST_TWITCH_CLIENT_ID: ${{ vars.FERROCAST_TWITCH_CLIENT_ID }}
          FERROCAST_YOUTUBE_CLIENT_ID: ${{ vars.FERROCAST_YOUTUBE_CLIENT_ID }}
          FERROCAST_YOUTUBE_CLIENT_SECRET: ${{ secrets.FERROCAST_YOUTUBE_CLIENT_SECRET }}
          FERROCAST_RELAY_URL: https://ferrocast-relay.clearcraftlabs.com
          # Signs the updater bundles; the public key is in tauri.conf.json (R-60).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OS_NAME: ${{ matrix.name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          # The bundler skips the Finder step on CI (CI=true), and that step is what sets
          # the DMG's background and icon places: 1.0.0 opened as a plain white window.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        working-directory: apps/desktop
        # Updater bundles are signed only here, where the key exists; local builds skip them.
        # RPM refuses a '-' in the version, so betas (0.1.0-beta.1) ship AppImage and .deb only.
        run: |
          bundles=""
          if [[ "$OS_NAME" == Linux && "$PRERELEASE" == true ]]; then bundles="--bundles appimage,deb"; fi
          # deploy/obs-runtime-{macos.sh,windows.ps1} wrote the list of OBS's engine files to copy in.
          obs=""
          if [[ "$OS_NAME" == macOS || "$OS_NAME" == Windows ]]; then obs="--config obs-runtime/tauri.obs.json"; fi
          # shellcheck disable=SC2086 # matrix.args, $bundles and $obs hold separate words.
          # --features deepfilter: the Studio's Strong noise removal (DeepFilterNet, its model built in).
          cargo tauri build ${{ matrix.args }} --features deepfilter $bundles $obs --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Remove the signing keychain
        if: always() && matrix.name == 'macOS'
        shell: bash
        run: deploy/macos-signing.sh teardown || true
      - name: Check the signature
        if: matrix.name == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        # Every build must be the same app to macOS: signed by our certificate, not ad-hoc.
        run: |
          app=$(ls -d ${{ matrix.out }}/macos/*.app)
          codesign --verify --deep --strict "$app"
          codesign -d -r- "$app" 2>&1 | grep -q 'certificate root = H"2b833f5797f85453043b7c4ac7bc18d6d644bcef"' \
            || { echo "::error::the app isn't signed with Ferrocast's certificate"; exit 1; }
      - name: Check the install window
        if: matrix.name == 'macOS'
        shell: bash
        # Finder writes .DS_Store (background, window size, icon places) only when its
        # step ran; without it the DMG opens as a plain white window.
        run: |
          dmg=$(ls ${{ matrix.out }}/dmg/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
          ok=true
          for f in .background/background.tiff .DS_Store; do
            if [[ ! -s "$mnt/$f" ]]; then echo "::error::the DMG has no $f"; ok=false; fi
          done
          hdiutil detach "$mnt" >/dev/null
          $ok
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferrocast-${{ matrix.name }}
          path: |
            ${{ matrix.out }}/dmg/*.dmg
            ${{ matrix.out }}/nsis/*.exe
            ${{ matrix.out }}/deb/*.deb
            ${{ matrix.out }}/rpm/*.rpm
            ${{ matrix.out }}/appimage/*.AppImage
            ${{ matrix.out }}/macos/*.app.tar.gz
            ${{ matrix.out }}/**/*.sig
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Put every bundle at the top of dist
        run: find dist -mindepth 2 -type f -exec mv -t dist {} +
      - name: Homebrew cask with this release's checksum
        # The cask follows stable releases only.
        if: needs.version.outputs.prerelease != 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          packaging/homebrew/update-cask.sh "$version" dist/Ferrocast_"${version}"_universal.dmg
          cp packaging/homebrew/Casks/ferrocast.rb dist/ferrocast.rb
      - name: Release notes (CHANGELOG.md)
        # The app shows them under "What's new" before updating; they're also the release's text.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! packaging/release-notes.sh "${TAG#v}" > release-notes.md; then
            echo "::warning::CHANGELOG.md has no section for ${TAG#v}: the app will only link to GitHub."
            : > release-notes.md
          fi
      - name: Update feed (latest.json)
        env:
          TAG: ${{ github.ref_name }}
        run: packaging/updater-manifest.sh "${TAG#v}" dist release-notes.md > dist/latest.json
      - name: Checksums (SHA256SUMS.txt)
        working-directory: dist
        run: |
          sums="$(find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum)"
          printf '%s\n' "$sums" > SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          # A beta must never become "latest": stable users' update feed reads that one.
          make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
