name: Windows Store package

# Builds Ferrocast's Microsoft Store package (packaging/windows-msix.ps1) and tests it on
# GitHub's Windows runner: installed with a throwaway certificate, started the way the Start
# menu does, checked to run from its package with FFmpeg beside it, then removed. The release
# workflow makes the same package for upload; this one runs when the packaging changes.

on:
  push:
    branches: [main, own-engine-only]
    paths:
      - 'packaging/msix/**'
      - 'packaging/windows-msix.ps1'
      - 'apps/desktop/src/store.rs'
      - 'crates/engine/src/ffmpeg_get.rs'
      - '.github/workflows/windows-store.yml'
  workflow_dispatch:
    inputs:
      web_ref:
        description: ferrocast-web branch to build the dashboard from (default the same branch name)
        required: false
        default: ''

concurrency:
  group: windows-store-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msix:
    name: Build and test the Store package
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/ferrocast-web
          ref: ${{ inputs.web_ref || github.ref_name }}
          token: ${{ github.token }}
          path: ferrocast-web
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ferrocast-web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ferrocast-web/pnpm-lock.yaml
      - name: Build the dashboard
        working-directory: ferrocast-web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the app (as the release does, no installer)
        working-directory: apps/desktop
        shell: bash
        env:
          FERROCAST_WEB_DIST: ${{ github.workspace }}/ferrocast-web/dist
        run: cargo tauri build --no-bundle --features deepfilter
      - name: Pack, install, start and remove the Store package
        shell: pwsh
        env:
          # Partner Center's identity for the reserved app, once it exists (repository
          # variables); without them a test identity is used.
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./packaging/windows-msix.ps1 -Exe target/release/ferrocast.exe -Out msix -Test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferrocast-store-msix
          path: msix/*.msix
          if-no-files-found: error
          retention-days: 14
