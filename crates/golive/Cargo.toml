[package]
name = "ferrocast-golive"
description = "Go live everywhere: a local RTMP ingest for OBS and one forwarder per platform (no re-encode)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# RTMP handshake, chunking and sessions, without I/O (MIT). The sockets are ours (Tokio).
rml_rtmp = "0.8"
bytes = "1"
fastrand = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
# SRT sends (the Studio's direct destinations): pure Rust SRT, Apache-2.0.
srt-tokio = "0.4.4"
futures = "0.3"
# WHIP sends: WebRTC (sans-IO, as the guest crate uses it), the offer posted over HTTPS, and the
# stream's AAC made Opus (WebRTC's sound): Symphonia's AAC decoder (MPL-2.0), libopus (BSD-3,
# built from its source).
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }
reqwest = { version = "0.13" }
symphonia-core = "0.6.1"
symphonia-codec-aac = "0.6.1"
opus = "0.4"
# RIST's main profile with a passphrase (VSF TR-06-2, as librist does it): AES-CTR keyed by
# PBKDF2-HMAC-SHA256 (RustCrypto, MIT/Apache-2.0).
aes = "0.8"
ctr = "0.9"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"

[lints]
workspace = true
