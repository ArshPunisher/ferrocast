[package]
name = "ferrocast-youtube"
description = "YouTube adapter: sign-in, live chat stream, REST."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
ferrocast-core.workspace = true
ferrocast-connector.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
url = "2"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
axum = "0.8"

[lints]
workspace = true
