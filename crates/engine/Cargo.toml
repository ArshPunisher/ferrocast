[package]
name = "ferrocast-engine"
description = "Wires adapters, the bot, moderation and alerts together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferrocast-core.workspace = true
ferrocast-connector.workspace = true
ferrocast-store.workspace = true
ferrocast-obs.workspace = true
ferrocast-golive.workspace = true
ferrocast-secrets.workspace = true
ferrocast-twitch.workspace = true
ferrocast-youtube.workspace = true
ferrocast-kick.workspace = true
reqwest = { version = "0.13", features = ["json"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# Pinned as the process-wide TLS provider (see `tls::install`): two backends end up in the
# app, and rustls then refuses to guess.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
async-trait = "0.1"
sys-locale = "0.3"
getrandom = "0.4"
fastrand = "2"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Pro cloud backups: encrypted on this PC (X25519, optional scrypt passphrase). No default
# features: no plugins, SSH keys, armor or async.
age = { version = "0.12", default-features = false }
sha2 = "0.11"
flate2 = "1"
base64 = "0.23"

[dev-dependencies]
tempfile = "3"
ferrocast-testkit.workspace = true
ferrocast-relay = { path = "../relay" }
axum = { version = "0.8", features = ["ws"] }
rsa = { version = "0.9", features = ["sha2"] }
rand_core = { version = "0.6", features = ["getrandom"] }
url = "2"

[lints]
workspace = true
