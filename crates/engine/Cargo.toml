[package]
name = "ferrocast-engine"
description = "Wires adapters, the bot, moderation and alerts together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferrocast-core.workspace = true
ferrocast-connector.workspace = true
ferrocast-store.workspace = true
ferrocast-obs.workspace = true
ferrocast-secrets.workspace = true
ferrocast-twitch.workspace = true
ferrocast-youtube.workspace = true
ferrocast-kick.workspace = true
reqwest = { version = "0.13", features = ["json"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
async-trait = "0.1"
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"
ferrocast-testkit.workspace = true
ferrocast-relay = { path = "../relay" }
axum = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.23"
url = "2"

[lints]
workspace = true
