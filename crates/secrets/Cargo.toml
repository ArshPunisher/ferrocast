[package]
name = "ferrocast-secrets"
description = "Secrets (tokens, passwords): a private file on macOS, the OS keychain elsewhere; never in the database."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
thiserror.workspace = true

# macOS uses a private file instead (unsigned builds make the Keychain ask for the login
# password after every update); see src/lib.rs.
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = "4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
