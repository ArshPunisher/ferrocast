[package]
name = "ferrocast-studio"
description = "The Studio's engine: OBS's libobs and its plugins, loaded at runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
libloading = "0.8"
raw-window-handle = "0.6"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
png = "0.17"
# Scene pictures as data URLs (the Scenes grid), on every platform.
base64 = "0.23"
# Remove background where Apple's Vision isn't: Robust Video Matting run by tract (pure Rust).
tract-onnx = { version = "0.23", optional = true }
# Strong noise removal: DeepFilterNet 3 with its model built in, at one exact commit (it isn't on
# crates.io with its model). Release builds only: see the `deepfilter` feature.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"], optional = true }
ndarray15 = { package = "ndarray", version = "0.15", optional = true }
# DeepFilterNet builds against the tract its own Cargo.lock has (later 0.21s moved to ndarray 0.16
# and no longer build it): held there.
tract-core-df = { package = "tract-core", version = "=0.21.4", optional = true }
tract-onnx-df = { package = "tract-onnx", version = "=0.21.4", optional = true }
tract-pulse-df = { package = "tract-pulse", version = "=0.21.4", optional = true }
tract-hir-df = { package = "tract-hir", version = "=0.21.4", optional = true }

[features]
# Remove background with RVM on macOS too (to try it; Vision is the default there).
onnx-matte = ["dep:tract-onnx"]
# The Strong noise removal filter (DeepFilterNet). CI and releases build it; day-to-day builds
# don't need to compile the model.
deepfilter = [
  "dep:deep_filter",
  "dep:ndarray15",
  "dep:tract-core-df",
  "dep:tract-onnx-df",
  "dep:tract-pulse-df",
  "dep:tract-hir-df",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSThread", "NSArray", "NSEnumerator", "NSString", "NSURL", "NSURLRequest", "NSError", "NSLocale", "NSData", "NSDictionary"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSImage", "NSGraphics", "NSScreen", "NSEvent", "NSWorkspace", "NSRunningApplication", "objc2-core-foundation"] }
# The Web page source: a WKWebView snapshotted into a texture (2.1, Browser source on WebKit).
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKSnapshotConfiguration", "WKNavigation", "WKUserScript", "WKUserContentController", "WKPreferences", "WKScriptMessage", "WKScriptMessageHandler"] }
block2 = "0.6"
# Live captions: Apple's Speech recognizer on the device, fed the Studio's audio (plan item 7).
objc2-speech = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFErrors", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFSpeechRecognitionTaskHint", "SFSpeechRecognizer", "SFTranscription"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioBuffer", "AVAudioFormat", "AVAudioTypes"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2", "objc2"] }
# Smart vertical: Apple's Vision finds faces in a small snapshot of the item (plan item 8).
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-image-io", "VNTypes", "VNRequest", "VNRequestHandler", "VNObservation", "VNDetectFaceRectanglesRequest", "VNGenerateAttentionBasedSaliencyImageRequest", "VNGeneratePersonSegmentationRequest", "VNStatefulRequest", "objc2-core-video"] }
# Remove background reads Vision's person mask (a CVPixelBuffer).
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }

# The Studio's picture in the app's window (a child window libobs draws into with D3D11).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tract-onnx = "0.23"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSApplication", "NSRunningApplication", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSThread", "NSDate", "NSRunLoop", "NSString"] }

[dev-dependencies]
tempfile = "3"
# The vod_track example's little RTMP server (as Go live's tests use).
rml_rtmp = "0.8"
# The examples print libobs's own log (FERROCAST_LOG=info).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The workspace forbids unsafe code. Calling libobs needs it, so here it is denied instead and
# allowed in src/ffi.rs only, each block with its SAFETY reason (LESSONS R-73).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
