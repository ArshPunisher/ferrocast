[package]
name = "ferrocast-core"
description = "Ferrocast's pure core: events, dedupe, templates, alert rules and queue, commands, filters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-normalization = "0.1"
# Auto-reply patterns: linear-time matching with a size cap (no catastrophic backtracking).
regex = { version = "1.13", default-features = false, features = ["std", "unicode", "perf"] }
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode"] }

[lints]
workspace = true
