<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(bricolage.woff2) format('woff2');font-weight:200 800}
@font-face{font-family:H;src:url(hanken.woff2) format('woff2');font-weight:100 900}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0d1014}
.bg{position:absolute;inset:0;background:
 radial-gradient(900px 600px at 82% 78%, rgba(255,164,36,.16), transparent 70%),
 radial-gradient(700px 500px at 12% 12%, rgba(51,212,255,.08), transparent 70%), #0d1014}
.wrap{position:absolute;left:180px;top:50%;transform:translateY(-50%)}
.dot{display:inline-flex;align-items:center;gap:18px;font:600 34px/1 H,sans-serif;color:#ffa424;letter-spacing:.02em}
.dot i{width:16px;height:16px;border-radius:50%;background:#ffa424;box-shadow:0 0 24px #ffa424}
h1{margin:34px 0 0;font:700 168px/1 B,sans-serif;color:#f4f6f8;letter-spacing:-.035em}
p{margin:38px 0 0;font:500 44px/1.3 H,sans-serif;color:#9aa4ae;max-width:1100px}
.bar{position:absolute;left:180px;right:180px;bottom:120px;height:4px;border-radius:2px;background:linear-gradient(90deg,#ffa424,rgba(255,164,36,0))}
</style></head><body><div class="bg"></div><div class="wrap">
<div class="dot"><i></i>Stream paused</div>
<h1>Be right back</h1>
<p>Hang tight, the stream picks up again in a moment.</p>
</div><div class="bar"></div></body></html>
