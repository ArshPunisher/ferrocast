<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<link rel="manifest" href="/irl/manifest.webmanifest">
<link rel="icon" href="/irl/icon-192.png">
<link rel="apple-touch-icon" href="/irl/icon-180.png">
<title>Ferrocast IRL</title>
<style>
  :root {
    --bg: #0d1014; --panel: rgba(13,16,20,.72); --line: rgba(255,255,255,.14);
    --text: #f4f6f8; --text-2: #b6bec7; --accent: #e8870e; --ok: #2fbf71; --warn: #f2b33d; --bad: #ef5350;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 500 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  body { min-height: 100dvh; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  video.front { transform: scaleX(-1); }
  .top { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: linear-gradient(rgba(0,0,0,.55), transparent); }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font-weight: 650; font-size: 15px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text-2); }
  .pill[data-tone="live"] .dot { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
  .pill[data-tone="ok"] .dot { background: var(--ok); }
  .pill[data-tone="warn"] .dot { background: var(--warn); }
  .pill[data-tone="bad"] .dot { background: var(--bad); }
  .time { font-variant-numeric: tabular-nums; }
  .platforms { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
  .platforms .pill { height: 28px; font-size: 13.5px; font-weight: 600; padding: 0 10px; }
  .note { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 132px);
    padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
    font-size: 15px; color: var(--text); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .note[hidden] { display: none; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 24px calc(env(safe-area-inset-bottom) + 20px);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .side { justify-self: center; display: grid; place-items: center; gap: 4px; min-width: 64px; min-height: 64px;
    border-radius: 18px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; font-weight: 650; padding: 8px 10px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .side[aria-pressed="true"] { background: #fff; color: #111; }
  .go { width: 86px; height: 86px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; font-size: 17px;
    box-shadow: 0 0 0 5px rgba(255,255,255,.9), 0 10px 30px rgba(232,135,14,.45); transition: transform .12s ease; }
  .go:active { transform: scale(.96); }
  .go.live { background: var(--bad); box-shadow: 0 0 0 5px rgba(255,255,255,.9), 0 10px 30px rgba(239,83,80,.45); }
  .go:disabled { opacity: .55; }
  .blank { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--bg); }
  .blank[hidden], .pill[hidden] { display: none; }
  .blank h1 { font-size: 26px; margin: 0 0 10px; letter-spacing: -.01em; }
  .blank p { color: var(--text-2); margin: 0 auto; max-width: 34ch; }
  .blank button { margin-top: 22px; height: 52px; padding: 0 26px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 750; }
  @media (prefers-reduced-motion: reduce) { .go { transition: none; } }
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>

<div class="top">
  <span class="pill" id="state" data-tone="idle" role="status" aria-live="polite"><span class="dot"></span><span id="state-text">Ready</span></span>
  <span class="pill time" id="time" hidden>0:00</span>
  <div class="platforms" id="platforms" aria-label="Your platforms"></div>
</div>

<div class="note" id="note" hidden role="alert"></div>

<div class="bar">
  <button class="side" id="flip" type="button" aria-label="Switch camera">Flip</button>
  <button class="go" id="go" type="button" disabled>Go live</button>
  <button class="side" id="mic" type="button" aria-pressed="false" aria-label="Mute the microphone">Mic on</button>
</div>

<div class="blank" id="blank" hidden>
  <div>
    <h1 id="blank-title">Allow the camera</h1>
    <p id="blank-text">Ferrocast needs your camera and microphone to stream from this phone.</p>
    <button id="blank-btn" type="button">Try again</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  // The link's #id.secret, kept on this phone (a reload, or a tapped alert, opens /irl alone);
  // it leaves the address bar.
  let pair = location.hash.slice(1);
  try { if (pair) localStorage.setItem('ferrocast-irl', pair); else pair = localStorage.getItem('ferrocast-irl') || ''; } catch {}
  const [id, secret] = pair.split('.');
  history.replaceState(null, '', location.pathname);
  const $ = (x) => document.getElementById(x);
  const video = $('v'), go = $('go'), flip = $('flip'), mic = $('mic'), note = $('note');
  let stream = null, pc = null, facing = 'environment', wantLive = false, liveSince = 0, lock = null, retry = null, picture = { width: 1280, height: 720, fps: 30 }, pushKey = null;

  const say = (tone, text) => { $('state').dataset.tone = tone; $('state-text').textContent = text; };
  const tell = (text) => { note.hidden = !text; note.textContent = text || ''; };
  const blank = (title, text, again) => {
    $('blank').hidden = false; $('blank-title').textContent = title; $('blank-text').textContent = text;
    $('blank-btn').hidden = !again; $('blank-btn').onclick = again;
  };

  if (!id || !secret) { blank('This link is missing a part', 'Open the link from your computer again, or scan its code.'); return; }
  if (!window.RTCPeerConnection || !navigator.mediaDevices) { blank('This browser can’t stream', 'Open the link in Safari on iPhone or Chrome on Android.'); return; }

  async function camera() {
    const old = stream;
    const s = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: picture.width }, height: { ideal: picture.height }, frameRate: { ideal: picture.fps } },
      audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true },
    });
    s.getAudioTracks().forEach((t) => (t.enabled = mic.getAttribute('aria-pressed') !== 'true'));
    stream = s;
    video.srcObject = s;
    video.classList.toggle('front', facing === 'user');
    if (pc) {
      for (const sender of pc.getSenders()) {
        const t = s.getTracks().find((x) => x.kind === sender.track?.kind);
        if (t) await sender.replaceTrack(t);
      }
    }
    old?.getTracks().forEach((t) => t.stop());
  }

  function preferH264(tr) {
    const caps = RTCRtpSender.getCapabilities?.('video');
    if (!caps || !tr.setCodecPreferences) return;
    const h264 = caps.codecs.filter((c) => /h264/i.test(c.mimeType) && /packetization-mode=1/.test(c.sdpFmtpLine || ''));
    if (h264.length) tr.setCodecPreferences(h264);
  }

  async function connect() {
    pc?.close();
    const p = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    pc = p;
    for (const t of stream.getTracks()) {
      const tr = p.addTransceiver(t, { direction: 'sendonly', streams: [stream],
        sendEncodings: t.kind === 'video' ? [{ maxBitrate: 4500000 }] : undefined });
      if (t.kind === 'video') preferH264(tr);
    }
    p.onconnectionstatechange = () => {
      if (pc !== p) return;
      if (p.connectionState === 'connected') { say('live', 'Live'); tell(''); }
      if (['failed', 'disconnected'].includes(p.connectionState) && wantLive) again('Signal lost: reconnecting…');
    };
    await p.setLocalDescription(await p.createOffer());
    // Every candidate in one offer (no trickle): at most two seconds.
    await new Promise((ok) => {
      if (p.iceGatheringState === 'complete') return ok();
      const t = setTimeout(ok, 2000);
      p.onicegatheringstatechange = () => p.iceGatheringState === 'complete' && (clearTimeout(t), ok());
    });
    const r = await fetch(`/v1/irl/${id}/offer`, { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ s: secret, offer: { type: 'offer', sdp: p.localDescription.sdp } }) });
    const v = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(v?.error?.message || 'Ferrocast Bond didn’t answer.');
    await p.setRemoteDescription(v.answer);
  }

  function again(why) {
    say('warn', 'Reconnecting');
    tell(why + ' Your channels show Be right back meanwhile.');
    clearTimeout(retry);
    retry = setTimeout(async () => {
      if (!wantLive) return;
      try { await connect(); } catch (e) { again(String(e.message || e)); }
    }, 3000);
  }

  async function wake() {
    try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.onrelease = () => (lock = null); } } catch {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wantLive) { wake(); if (pc?.connectionState !== 'connected') again('Back: reconnecting…'); }
  });

  // Pushes ("Signal lost", "Live again") for when the page is in the background: asked on
  // the Go live tap (browsers only ask on a tap), sent on once live.
  async function pushes(asked) {
    try {
      if (!pushKey || (await asked) !== 'granted') return;
      const reg = await navigator.serviceWorker.ready;
      const key = Uint8Array.from(atob(pushKey.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
      const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key }));
      await fetch(`/v1/irl/${id}/push`, { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ s: secret, subscription: sub.toJSON() }) });
    } catch {}
  }

  go.onclick = async () => {
    if (!wantLive) {
      const asked = pushKey && 'Notification' in window && 'PushManager' in window ? Notification.requestPermission() : null;
      wantLive = true; go.disabled = true; say('warn', 'Connecting');
      try {
        await connect(); wake(); pushes(asked);
        liveSince = Date.now(); go.textContent = 'End'; go.classList.add('live'); $('time').hidden = false;
      } catch (e) { wantLive = false; say('bad', 'Not live'); tell(String(e.message || e)); }
      go.disabled = false;
    } else {
      if (!confirm('End the stream on every platform?')) return;
      wantLive = false; clearTimeout(retry); pc?.close(); pc = null;
      await fetch(`/v1/irl/${id}/end`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ s: secret }) }).catch(() => {});
      lock?.release(); go.textContent = 'Ended'; go.disabled = true; go.classList.remove('live'); say('idle', 'Stream ended'); tell('');
    }
  };
  flip.onclick = async () => { facing = facing === 'environment' ? 'user' : 'environment'; try { await camera(); } catch {} };
  mic.onclick = () => {
    const off = mic.getAttribute('aria-pressed') !== 'true';
    mic.setAttribute('aria-pressed', String(off)); mic.textContent = off ? 'Muted' : 'Mic on';
    mic.setAttribute('aria-label', off ? 'Unmute the microphone' : 'Mute the microphone');
    stream?.getAudioTracks().forEach((t) => (t.enabled = !off));
  };

  const WORDS = { live: ['ok', 'Live'], connecting: ['warn', 'Connecting'], reconnecting: ['warn', 'Retrying'], waiting: ['idle', 'Waiting'], stopped: ['idle', 'Stopped'] };
  async function poll() {
    try {
      const r = await fetch(`/v1/irl/${id}`, { cache: 'no-store', headers: { 'x-irl-secret': secret } });
      if (r.status === 404) { wantLive = false; blank('This link has expired', 'Make a new one on your computer: Go live, Stream from your phone.'); return; }
      const v = await r.json();
      if (v.picture) picture = v.picture;
      pushKey = v.push_key || null;
      const box = $('platforms'); box.replaceChildren();
      for (const d of v.destinations || []) {
        const [tone, word] = WORDS[d.health?.state] || ['idle', d.health?.state || ''];
        const el = document.createElement('span'); el.className = 'pill'; el.dataset.tone = tone;
        el.innerHTML = '<span class="dot"></span>'; el.append(`${d.id} · ${word}`); box.append(el);
      }
      if (v.input === 'ended' && wantLive) { wantLive = false; say('idle', 'Stream ended'); go.textContent = 'Ended'; go.disabled = true; }
    } catch {}
    setTimeout(poll, 3000);
  }
  setInterval(() => {
    if (!liveSince || !wantLive) return;
    const s = Math.floor((Date.now() - liveSince) / 1000);
    $('time').textContent = `${Math.floor(s / 3600) ? Math.floor(s / 3600) + ':' : ''}${String(Math.floor(s / 60) % 60).padStart(Math.floor(s / 3600) ? 2 : 1, '0')}:${String(s % 60).padStart(2, '0')}`;
  }, 1000);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/irl/sw.js', { scope: '/irl' }).catch(() => {});
  (async () => {
    await poll();
    const start = async () => {
      try { await camera(); $('blank').hidden = true; go.disabled = false; }
      catch { blank('Allow the camera', 'Ferrocast needs your camera and microphone to stream from this phone. Allow them, then try again.', start); }
    };
    await start();
  })();
})();
</script>
</body>
</html>
