[package]
name = "ferrocast-bond"
description = "Ferrocast Bond (Pro): a stream sent over every connection at once (SRTLA) arrives here and goes on to the platforms from the cloud, held on a Be right back picture if the computer drops."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ferrocast-golive.workspace = true
axum = "0.8"
bytes = "1"
rml_rtmp = "0.8"
futures = "0.3"
getrandom = "0.3"
hmac = "0.12"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
srt-tokio = "0.4.4"
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
