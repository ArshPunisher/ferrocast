[package]
name = "ferrocast-relay"
description = "Hosted relay: Kick webhooks, payments, sign-in broker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ferrocast-relay"
path = "src/main.rs"

[dependencies]
# The cloud bot (Pro F1) shares the desktop bot's rules and the platforms' event mapping.
ferrocast-core.workspace = true
ferrocast-twitch.workspace = true
ferrocast-kick.workspace = true
ferrocast-youtube.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json", "form", "query"] }
rsa = { version = "0.9", features = ["sha2"] }
base64 = "0.23"
getrandom = "0.4"
subtle = "2"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
hmac = "0.12"
url = "2"
# Custom tip addresses (Pro F6): the Public Suffix List (ICANN and private entries, built in),
# punycode to Unicode, and UTS #39 mixed-script and confusable checks.
psl = "2"
idna = "1"
unicode-security = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Tip page images (Pro F6): decode PNG/JPEG/WebP, re-encode as WebP. Pure Rust, no C codecs.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Discord interactions (Pro F4): Ed25519 signature checks only, no signing in shipped code.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }

[dev-dependencies]
ferrocast-testkit.workspace = true
# Paused clocks for the cloud bot's lease tests.
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
tokio-tungstenite = "0.30"
rand_core = { version = "0.6", features = ["getrandom"] }

[lints]
workspace = true
