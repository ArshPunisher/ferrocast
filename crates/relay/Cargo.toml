[package]
name = "ferrocast-relay"
description = "Hosted relay: Kick webhooks, payments, sign-in broker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ferrocast-relay"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json", "form", "query"] }
rsa = { version = "0.9", features = ["sha2"] }
base64 = "0.23"
getrandom = "0.4"
subtle = "2"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
hmac = "0.12"
url = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
ferrocast-testkit.workspace = true
tempfile = "3"
tokio-tungstenite = "0.30"
rand_core = { version = "0.6", features = ["getrandom"] }

[lints]
workspace = true
