[package]
name = "ferrocast-desktop"
description = "The Ferrocast desktop app: tray, one window, the engine and the local server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "ferrocast"

[[bin]]
name = "ferrocast"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ferrocast-core.workspace = true
ferrocast-engine.workspace = true
ferrocast-server.workspace = true
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"

[dev-dependencies]
# A mock app runs the real updater plugin against local feeds (main.rs tests).
tauri = { version = "2", features = ["tray-icon", "test"] }
base64 = "0.22"

[lints]
workspace = true
