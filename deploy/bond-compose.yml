# Ferrocast Bond (Pro) next to the relay on the Oracle server, NOT started by the relay's
# deploys: started by hand once the owner opens its UDP ports (deploy/README.md, "Bond").
#   bond.env   BOND_SECRET (the same as the relay's), BOND_KEEPALIVE, BOND_MAX (chmod 600)
# Its API goes through the relay's Cloudflare Tunnel (a second public hostname pointing at
# http://ferrocast-bond:8795); the stream can't (tunnels carry no UDP), so 5000/udp (SRTLA)
# and 5001/udp (SRT) are published on the host.
name: ferrocast-bond

services:
  bond:
    image: ${BOND_IMAGE:-ferrocast-bond}:${BOND_TAG:-latest}
    container_name: ferrocast-bond
    restart: unless-stopped
    env_file: bond.env
    ports:
      - "5000:5000/udp"
      - "5001:5001/udp"
    networks: [relay]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        # Each stream holds a few seconds of video per platform; 50 streams fit well under this.
        limits: { memory: 2g }

networks:
  relay:
    name: ferrocast-relay_ferrocast
    external: true
