# Ferrocast relay on the Oracle server (/opt/ferrocast-relay), reached only through its own
# Cloudflare Tunnel: no port is published on the host.
#   relay.env    RELAY_PUBLIC_URL, KICK_CLIENT_ID, KICK_CLIENT_SECRET, and Pro's RAZORPAY_* and
#                PRO_SALES_OPEN from razorpay-keys.sh, RELAY_VAULT_KEY from vault-key.sh
#                (chmod 600). Pro's files go to /data/blobs in the relay-data volume.
#   dashboard/   the dashboard builds phones get (Pro "Dashboard anywhere"): releases/<date>/
#                and a `current` link, switched by dashboard-swap.sh; mounted read-only at
#                /dashboard and never renamed (RELAY_DASHBOARD_DIR=/dashboard/current)
#   tunnel.env   TUNNEL_TOKEN from the Cloudflare dashboard (chmod 600)
name: ferrocast-relay

services:
  relay:
    # GitHub Actions deploys set RELAY_IMAGE/RELAY_TAG (ghcr.io/arshpunisher/ferrocast-relay);
    # a hand deploy (deploy/deploy-relay.sh) builds and loads ferrocast-relay:latest.
    image: ${RELAY_IMAGE:-ferrocast-relay}:${RELAY_TAG:-latest}
    container_name: ferrocast-relay
    restart: unless-stopped
    env_file: relay.env
    volumes:
      - relay-data:/data
      - ./dashboard:/dashboard:ro
    networks: [ferrocast]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        # Phones through the relay can have answers up to 8 MB in flight (Pro F2); the server has 24 GB.
        limits: { memory: 1g }

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    container_name: ferrocast-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: tunnel.env
    depends_on: [relay]
    networks: [ferrocast]
    security_opt: ["no-new-privileges:true"]

volumes:
  relay-data:

networks:
  ferrocast:
