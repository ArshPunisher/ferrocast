[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0-beta.4"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/ArshPunisher/ferrocast"
publish = false

[workspace.dependencies]
ferrocast-core = { path = "crates/core" }
ferrocast-connector = { path = "crates/connector" }
ferrocast-store = { path = "crates/store" }
ferrocast-twitch = { path = "crates/twitch" }
ferrocast-youtube = { path = "crates/youtube" }
ferrocast-kick = { path = "crates/kick" }
ferrocast-obs = { path = "crates/obs" }
ferrocast-secrets = { path = "crates/secrets" }
ferrocast-engine = { path = "crates/engine" }
ferrocast-server = { path = "crates/server" }
ferrocast-testkit = { path = "crates/testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util", "fs", "signal", "process"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

# Line tables are enough for backtraces; full debug info made target/ 7 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
