# cargo-deny: licences, advisories, bans and sources. Runs in CI's static job.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained (not a vulnerability): read at build time by i18n-embed-fl, the proc macro
  # age uses for its error messages. Nothing parses TOML at run time. Revisit when age moves
  # off it.
  { id = "RUSTSEC-2026-0374", reason = "unmaintained, build-time only via age's i18n proc macro" },
  # Build-time macro crate pulled in by gtk-rs 0.18 (Tauri's Linux webview stack). Not a
  # vulnerability; no maintained replacement upstream yet. Revisit when Tauri moves to gtk4.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained, transitive via gtk 0.18 in Tauri on Linux" },
  # The Marvin attack recovers keys from RSA *decryption* timing. Ferrocast only verifies
  # Kick's webhook signatures with Kick's public key (relay) and signs in tests; no private
  # key ever decrypts anything in a shipped binary. Revisit when rsa 0.10 is stable.
  { id = "RUSTSEC-2023-0071", reason = "signature verification only; no RSA decryption in shipped code" },
  # zip 4 inside tauri-plugin-updater: the extract() flaws need an attacker-made archive, and
  # the updater only unpacks an update after checking our minisign signature. Ferrocast's
  # own code uses zip 9 and never calls extract(). Revisit when the updater moves to zip 9.
  { id = "RUSTSEC-2026-0367", reason = "zip 4 via tauri-plugin-updater; archives are signature-checked first" },
  { id = "RUSTSEC-2026-0368", reason = "zip 4 via tauri-plugin-updater; archives are signature-checked first" },
  { id = "RUSTSEC-2026-0369", reason = "zip 4 via tauri-plugin-updater; archives are signature-checked first" },
  # zbus's zvariant crates, marked unmaintained, not vulnerable: Linux notifications and the
  # keyring use them, and there is no replacement yet. Revisit with the next Tauri release.
  { id = "RUSTSEC-2026-0370", reason = "unmaintained, transitive via zbus (Linux notifications, keyring)" },
  { id = "RUSTSEC-2026-0371", reason = "unmaintained, transitive via zbus (Linux notifications, keyring)" },
  { id = "RUSTSEC-2026-0372", reason = "unmaintained, transitive via zbus (Linux notifications, keyring)" },
]

[licenses]
version = 2
# Everything here can be distributed inside a GPL-3.0 program.
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0", "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Layering (ARCHITECTURE.md §2): only the desktop app may use Tauri.
deny = [{ name = "tauri", wrappers = ["ferrocast-desktop", "tauri-plugin-single-instance", "tauri-plugin-global-shortcut", "tauri-plugin-opener", "tauri-plugin-autostart", "tauri-plugin-window-state", "tauri-plugin-notification", "tauri-plugin-updater"] }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
