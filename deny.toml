# cargo-deny: licences, advisories, bans and sources. Runs in CI's static job.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Timing branches in crypto-bigint 0.5 (fixed in 0.7.6). It reaches us only through age's
  # P-256 tagged recipients (p256, hpke). Ferrocast encrypts and decrypts backups with age's
  # x25519 and scrypt only, which never run that code. Revisit when age moves to crypto-bigint 0.7.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 only via age's P-256 recipients, which Ferrocast never uses" },
  # Unmaintained (not a vulnerability): read at build time by i18n-embed-fl, the proc macro
  # age uses for its error messages. Nothing parses TOML at run time. Revisit when age moves
  # off it.
  { id = "RUSTSEC-2026-0374", reason = "unmaintained, build-time only via age's i18n proc macro" },
  # The emSign roots: webpki-roots 0.26.11 (tokio-tungstenite's feature) is a re-export of
  # webpki-roots 1, which is 1.0.10 here with those roots removed. The advisory's version range
  # still names 0.26. Revisit when tokio-tungstenite moves to webpki-roots 1.
  { id = "RUSTSEC-2026-0381", reason = "0.26.11 only re-exports webpki-roots 1.0.10, which drops the emSign roots" },
  # tract 0.21.4, held for DeepFilterNet (Strong noise removal; later 0.21s move to ndarray 0.16,
  # which it doesn't build with). The overflow is in tract-nnef's NNEF tensor reader on loading
  # a crafted model; DeepFilterNet loads only its own ONNX model, built into the app, so no one
  # can hand it one. Revisit when DeepFilterNet moves to a newer tract.
  { id = "RUSTSEC-2026-0217", reason = "tract-nnef 0.21.4 for DeepFilterNet: only its built-in ONNX model is ever loaded, never NNEF from outside" },
  # Unmaintained (not vulnerabilities), through tract: anymap2 (liquid, tract-hir's templates)
  # and paste (a build-time macro). Revisit with tract.
  { id = "RUSTSEC-2026-0319", reason = "unmaintained, only through tract (liquid via tract-hir)" },
  { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time macro, only through tract" },
  # Build-time macro crate pulled in by gtk-rs 0.18 (Tauri's Linux webview stack). Not a
  # vulnerability; no maintained replacement upstream yet. Revisit when Tauri moves to gtk4.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained, transitive via gtk 0.18 in Tauri on Linux" },
  # The Marvin attack recovers keys from RSA *decryption* timing. Ferrocast only verifies
  # Kick's webhook signatures with Kick's public key (relay) and signs in tests; no private
  # key ever decrypts anything in a shipped binary. Revisit when rsa 0.10 is stable.
  { id = "RUSTSEC-2023-0071", reason = "signature verification only; no RSA decryption in shipped code" },
  # zip 4 inside tauri-plugin-updater: the extract() flaws need an attacker-made archive, and
  # the updater only unpacks an update after checking our minisign signature. Ferrocast's
  # own code uses zip 9 and never calls extract(). Revisit when the updater moves to zip 9.
  { id = "RUSTSEC-2026-0367", reason = "zip 4 via tauri-plugin-updater; archives are signature-checked first" },
  { id = "RUSTSEC-2026-0368", reason = "zip 4 via tauri-plugin-updater; archives are signature-checked first" },
  { id = "RUSTSEC-2026-0369", reason = "zip 4 via tauri-plugin-updater; archives are signature-checked first" },
  # zbus's zvariant crates, marked unmaintained, not vulnerable: Linux notifications and the
  # keyring use them, and there is no replacement yet. Revisit with the next Tauri release.
  { id = "RUSTSEC-2026-0370", reason = "unmaintained, transitive via zbus (Linux notifications, keyring)" },
  { id = "RUSTSEC-2026-0371", reason = "unmaintained, transitive via zbus (Linux notifications, keyring)" },
  { id = "RUSTSEC-2026-0372", reason = "unmaintained, transitive via zbus (Linux notifications, keyring)" },
]

[licenses]
version = 2
# Everything here can be distributed inside a GPL-3.0 program.
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0", "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
]
confidence-threshold = 0.9
# whisper-rs (live captions, 30 Oct) is public domain (the Unlicense, GPL-compatible): allowed
# for these two crates only.
exceptions = [
  { allow = ["Unlicense"], crate = "whisper-rs" },
  { allow = ["Unlicense"], crate = "whisper-rs-sys" },
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Layering (ARCHITECTURE.md §2): only the desktop app may use Tauri.
deny = [{ name = "tauri", wrappers = ["ferrocast-desktop", "tauri-plugin-single-instance", "tauri-plugin-global-shortcut", "tauri-plugin-opener", "tauri-plugin-autostart", "tauri-plugin-window-state", "tauri-plugin-notification", "tauri-plugin-updater", "tauri-plugin-dialog", "tauri-plugin-fs"] }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# DeepFilterNet (Strong noise removal): its crates.io release lacks the model; pinned by rev.
allow-git = ["https://github.com/Rikorose/DeepFilterNet"]
